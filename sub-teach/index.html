<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sub-Teach | The Rock Academy</title>
  <style>
    :root {
      --purple: #542D80;
      --purple-light: #7B4FAF;
      --purple-dark: #3A1F5C;
      --gold: #FDB924;
      --gold-dark: #D9991A;
      --light-gray: #E6E7E8;
      --charcoal: #6D6E71;
      --white: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--light-gray);
      color: var(--charcoal);
      min-height: 100vh;
    }

    /* ── PASSWORD GATE ── */
    #gate {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--purple-dark);
    }
    .gate-box {
      background: var(--white);
      border-radius: 12px;
      padding: 48px 40px;
      width: 340px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.35);
    }
    .gate-logo {
      width: 80px;
      height: 80px;
      background: var(--purple);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--gold);
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
    }
    .gate-box h1 {
      color: var(--purple);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .gate-box p {
      color: var(--charcoal);
      font-size: 13px;
      margin-bottom: 28px;
    }
    .gate-box input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--light-gray);
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 12px;
    }
    .gate-box input:focus { border-color: var(--purple); }
    .gate-box button {
      width: 100%;
      padding: 12px;
      background: var(--purple);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .gate-box button:hover { background: var(--purple-light); }
    .gate-error {
      color: #c0392b;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    /* ── APP SHELL ── */
    #app { display: none; }

    header {
      background: var(--purple);
      color: var(--white);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      width: 36px;
      height: 36px;
      background: var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--purple);
      font-weight: 900;
      font-size: 14px;
    }
    .header-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .header-title span {
      color: var(--gold);
    }
    nav {
      display: flex;
      gap: 4px;
    }
    nav button {
      background: transparent;
      border: 2px solid transparent;
      color: rgba(255,255,255,0.75);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    nav button.active {
      background: var(--gold);
      color: var(--purple);
      border-color: var(--gold);
    }
    nav button:hover:not(.active) {
      border-color: rgba(255,255,255,0.4);
      color: var(--white);
    }

    .view { display: none; padding: 24px; max-width: 960px; margin: 0 auto; }
    .view.active { display: block; }

    /* ── DAY HEADER BANNER ── */
    .day-banner {
      background: var(--white);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .day-left h2 {
      font-size: 22px;
      color: var(--purple);
      font-weight: 700;
    }
    .day-left p {
      font-size: 13px;
      color: var(--charcoal);
      margin-top: 2px;
    }
    .day-badge {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .day-badge.odd { background: var(--purple); color: var(--gold); }
    .day-badge.even { background: var(--gold); color: var(--purple); }
    .day-badge.no-school { background: var(--light-gray); color: var(--charcoal); font-size: 13px; }

    /* ── CLASS SELECTOR ── */
    .class-selector {
      background: var(--white);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .class-selector label {
      font-size: 13px;
      font-weight: 700;
      color: var(--purple);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .class-selector select {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid var(--light-gray);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--charcoal);
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .class-selector select:focus { border-color: var(--purple); }

    /* ── LESSON CARDS ── */
    .lesson-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    @media (max-width: 680px) {
      .lesson-grid { grid-template-columns: 1fr; }
    }
    .lesson-card {
      background: var(--white);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative;
    }
    .lesson-card.today {
      border: 2px solid var(--purple);
      box-shadow: 0 4px 20px rgba(84,45,128,0.15);
    }
    .lesson-card.today::before {
      content: 'TODAY';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--purple);
      color: var(--gold);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 3px 10px;
      border-radius: 4px;
    }
    .card-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--charcoal);
      margin-bottom: 8px;
      opacity: 0.6;
    }
    .card-date {
      font-size: 13px;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 12px;
    }
    .card-lesson-num {
      font-size: 11px;
      color: var(--charcoal);
      margin-bottom: 4px;
      opacity: 0.7;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--purple-dark);
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .card-topics {
      font-size: 12px;
      color: var(--charcoal);
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .card-hw {
      background: var(--light-gray);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--charcoal);
    }
    .card-hw strong {
      color: var(--purple);
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }
    .card-quiz {
      display: inline-block;
      background: var(--gold);
      color: var(--purple);
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    /* ── COMPLETE + NOTES ── */
    .actions-row {
      background: var(--white);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .actions-row h3 {
      font-size: 13px;
      font-weight: 700;
      color: var(--purple);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .complete-btn {
      background: var(--purple);
      color: var(--white);
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 16px;
    }
    .complete-btn:hover { background: var(--purple-light); }
    .complete-btn.done {
      background: #2ecc71;
      color: var(--white);
    }
    .notes-area {
      width: 100%;
      min-height: 90px;
      padding: 10px 14px;
      border: 2px solid var(--light-gray);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      color: var(--charcoal);
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    .notes-area:focus { border-color: var(--purple); }
    .notes-saved {
      font-size: 11px;
      color: #2ecc71;
      margin-top: 6px;
      display: none;
    }

    /* ── CALENDAR VIEW ── */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .cal-header h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--purple);
    }
    .cal-nav button {
      background: var(--white);
      border: 2px solid var(--light-gray);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
      color: var(--purple);
      font-weight: 600;
      transition: all 0.15s;
    }
    .cal-nav button:hover {
      border-color: var(--purple);
      background: var(--purple);
      color: var(--white);
    }
    .cal-grid {
      background: var(--white);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--purple);
    }
    .cal-weekdays span {
      text-align: center;
      padding: 10px 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.8);
      text-transform: uppercase;
    }
    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-left: 1px solid var(--light-gray);
      border-top: 1px solid var(--light-gray);
    }
    .cal-day {
      border-right: 1px solid var(--light-gray);
      border-bottom: 1px solid var(--light-gray);
      min-height: 72px;
      padding: 8px;
      font-size: 13px;
      position: relative;
    }
    .cal-day.empty { background: #f9f9f9; }
    .cal-day.today-cell { background: #f5f0ff; }
    .cal-day-num {
      font-weight: 700;
      color: var(--charcoal);
      font-size: 13px;
    }
    .cal-day.today-cell .cal-day-num {
      background: var(--purple);
      color: var(--white);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .cal-type {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      margin-top: 4px;
    }
    .cal-type.odd { background: var(--purple); color: var(--gold); }
    .cal-type.even { background: var(--gold); color: var(--purple); }
    .cal-type.no-school { background: var(--light-gray); color: var(--charcoal); }
    .cal-type.exam { background: #e74c3c; color: var(--white); }
    .cal-type.camp { background: #27ae60; color: var(--white); }
    .cal-type.half { background: #f39c12; color: var(--white); }
    .cal-event {
      display: block;
      font-size: 10px;
      color: #e74c3c;
      font-weight: 700;
      margin-top: 3px;
      cursor: pointer;
      text-decoration: underline;
    }
    .cal-note {
      display: block;
      font-size: 10px;
      color: var(--charcoal);
      margin-top: 2px;
      opacity: 0.7;
      font-style: italic;
    }

    /* ── POPUP ── */
    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .popup-overlay.open { display: flex; }
    .popup {
      background: var(--white);
      border-radius: 12px;
      padding: 28px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.3);
    }
    .popup h3 {
      color: var(--purple);
      font-size: 18px;
      margin-bottom: 6px;
    }
    .popup-date {
      font-size: 12px;
      color: var(--charcoal);
      margin-bottom: 16px;
    }
    .popup-classes {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .popup-class {
      background: var(--light-gray);
      border-radius: 8px;
      padding: 10px 14px;
    }
    .popup-class strong {
      display: block;
      color: var(--purple);
      font-size: 13px;
      margin-bottom: 3px;
    }
    .popup-class span {
      font-size: 12px;
      color: var(--charcoal);
    }
    .popup-close {
      background: var(--purple);
      color: var(--white);
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .popup-close:hover { background: var(--purple-light); }

    /* ── LEGEND ── */
    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--charcoal);
    }
    .legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-logo">TRA</div>
    <h1>Sub-Teach Portal</h1>
    <p>The Rock Academy — Benjamin Gilmore</p>
    <input type="password" id="pw-input" placeholder="Enter password" />
    <button onclick="checkPw()">Enter</button>
    <div class="gate-error" id="pw-error">Incorrect password. Try again.</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <header>
    <div class="header-brand">
      <div class="header-logo">TRA</div>
      <span class="header-title">Sub-Teach &nbsp;|&nbsp; <span>The Rock Academy</span></span>
    </div>
    <nav>
      <button class="active" onclick="showView('dashboard')">Dashboard</button>
      <button onclick="showView('calendar')">Calendar</button>
    </nav>
  </header>

  <!-- DASHBOARD VIEW -->
  <div class="view active" id="view-dashboard">
    <div class="day-banner">
      <div class="day-left">
        <h2 id="banner-date">—</h2>
        <p id="banner-weekday">—</p>
      </div>
      <div class="day-badge" id="day-badge">—</div>
    </div>

    <div class="class-selector">
      <label>Class</label>
      <select id="class-select" onchange="renderDashboard()">
        <option value="precalc-p4">Pre-Calculus — Period 4 (Even)</option>
        <option value="geometry-p6">Geometry — Period 6 (Even)</option>
        <option value="precalc-p1">Pre-Calculus — Period 1 (Odd)</option>
        <option value="apcalc-p3">AP Calculus — Period 3 (Odd)</option>
        <option value="geometry-p5">Geometry — Period 5 (Odd)</option>
      </select>
    </div>

    <div class="lesson-grid" id="lesson-grid">
      <!-- populated by JS -->
    </div>

    <div class="actions-row">
      <h3>Today's Notes & Status</h3>
      <button class="complete-btn" id="complete-btn" onclick="toggleComplete()">Mark Today's Lesson Complete</button>
      <textarea class="notes-area" id="notes-area" placeholder="Add class notes, observations, or reminders..." oninput="saveNotes()"></textarea>
      <div class="notes-saved" id="notes-saved">✓ Saved</div>
    </div>
  </div>

  <!-- CALENDAR VIEW -->
  <div class="view" id="view-calendar">
    <div class="cal-header">
      <div class="cal-nav">
        <button onclick="prevMonth()">← Prev</button>
      </div>
      <h2 id="cal-month-label">—</h2>
      <div class="cal-nav">
        <button onclick="nextMonth()">Next →</button>
      </div>
    </div>
    <div class="cal-grid">
      <div class="cal-weekdays">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div class="cal-days" id="cal-days"><!-- populated by JS --></div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#542D80"></div> Odd Day</div>
      <div class="legend-item"><div class="legend-dot" style="background:#FDB924"></div> Even Day</div>
      <div class="legend-item"><div class="legend-dot" style="background:#E6E7E8"></div> No School</div>
      <div class="legend-item"><div class="legend-dot" style="background:#e74c3c"></div> Exam/Finals</div>
      <div class="legend-item"><div class="legend-dot" style="background:#27ae60"></div> Camp</div>
    </div>
  </div>
</div>

<!-- EVENT POPUP -->
<div class="popup-overlay" id="popup-overlay" onclick="closePopup(event)">
  <div class="popup" id="popup-content">
    <h3 id="popup-title">—</h3>
    <div class="popup-date" id="popup-date">—</div>
    <div class="popup-classes" id="popup-classes"></div>
    <button class="popup-close" onclick="closePopup()">Close</button>
  </div>
</div>

// ── UTILITY FUNCTIONS ──────────────────────────────────────────────────────
function toKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function getDayData(date) {
  return SCHEDULE[toKey(date)] || null;
}

function getDatesForClass(classId) {
  const cls = CLASSES[classId];
  return Object.entries(SCHEDULE)
    .filter(([, v]) => v.type === cls.dayType)
    .map(([k]) => k)
    .sort();
}

function getLessonForClass(classId, dateStr) {
  const dates = getDatesForClass(classId);
  const idx = dates.indexOf(dateStr);
  if (idx < 0) return null;
  const cls = CLASSES[classId];
  const content = LOREM_LESSONS[cls.name] || [];
  const lesson = content[idx % content.length];
  return { ...lesson, lessonNum: idx + 1, date: dateStr };
}

function getNearestClassDate(classId) {
  // Find today or most recent past class date for this class
  const today = toKey(new Date());
  const dates = getDatesForClass(classId);
  let best = dates[0];
  for (const d of dates) {
    if (d <= today) best = d;
    else break;
  }
  return best;
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function formatDateShort(dateStr) {
  if (!dateStr) return '—';
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

    document.getElementById('banner-weekday').textContent = 'No regular classes today';

}

// ── DASHBOARD ──────────────────────────────────────────────────────────────
function renderDashboard() {
  const classId = document.getElementById('class-select').value;
  const dates = getDatesForClass(classId);
  const today = toKey(new Date());

  // Find index of today or nearest past
  let todayIdx = -1;
  for (let i = 0; i < dates.length; i++) {
    if (dates[i] <= today) todayIdx = i;
    else break;
  }
  if (todayIdx < 0) todayIdx = 0;

  const prevDate = todayIdx > 0 ? dates[todayIdx - 1] : null;
  const todayDate = dates[todayIdx];
  const nextDate = todayIdx < dates.length - 1 ? dates[todayIdx + 1] : null;

  const prevLesson = prevDate ? getLessonForClass(classId, prevDate) : null;
  const todayLesson = todayDate ? getLessonForClass(classId, todayDate) : null;
  const nextLesson = nextDate ? getLessonForClass(classId, nextDate) : null;

  const grid = document.getElementById('lesson-grid');
  grid.innerHTML = '';

  grid.appendChild(buildCard(prevLesson, 'Previous', 'prev'));
  grid.appendChild(buildCard(todayLesson, "Today's Lesson", 'today'));
  grid.appendChild(buildCard(nextLesson, 'Next Lesson', 'next'));

  // Load notes and complete status
  const noteKey = `notes_${classId}_${todayDate}`;
  const completeKey = `complete_${classId}_${todayDate}`;
  document.getElementById('notes-area').value = localStorage.getItem(noteKey) || '';
  const isDone = localStorage.getItem(completeKey) === '1';
  const btn = document.getElementById('complete-btn');
  btn.textContent = isDone ? '✓ Lesson Marked Complete' : 'Mark Today\'s Lesson Complete';
  btn.className = 'complete-btn' + (isDone ? ' done' : '');
  btn._noteKey = noteKey;
  btn._completeKey = completeKey;
}

function buildCard(lesson, label, type) {
  const card = document.createElement('div');
  card.className = 'lesson-card' + (type === 'today' ? ' today' : '');

  if (!lesson) {
    card.innerHTML = `<div class="card-label">${label}</div><div style="color:#aaa;font-size:13px;margin-top:16px;">No class</div>`;
    return card;
  }

  const quizTag = lesson.quiz ? `<div class="card-quiz">⚠ QUIZ / TEST</div>` : '';
  const hw = lesson.hw || 'No homework assigned — check with teacher.';

  card.innerHTML = `
    <div class="card-label">${label}</div>
    <div class="card-date">${formatDateShort(lesson.date)}</div>
    ${quizTag}
    <div class="card-lesson-num">Lesson ${lesson.lessonNum}</div>
    <div class="card-title">${lesson.title}</div>
    <div class="card-topics">${lesson.topics}</div>
    <div class="card-hw"><strong>Homework</strong>${hw}</div>
  `;
  return card;
}

function toggleComplete() {
  const btn = document.getElementById('complete-btn');
  const key = btn._completeKey;
  const isDone = localStorage.getItem(key) === '1';
  if (isDone) {
    localStorage.removeItem(key);
    btn.textContent = 'Mark Today\'s Lesson Complete';
    btn.className = 'complete-btn';
  } else {
    localStorage.setItem(key, '1');
    btn.textContent = '✓ Lesson Marked Complete';
    btn.className = 'complete-btn done';
  }
}

function saveNotes() {
  const btn = document.getElementById('complete-btn');
  const key = btn._noteKey;
  localStorage.setItem(key, document.getElementById('notes-area').value);
  const saved = document.getElementById('notes-saved');
  saved.style.display = 'block';
  clearTimeout(saveNotes._timer);
  saveNotes._timer = setTimeout(() => { saved.style.display = 'none'; }, 1500);
}

  document.getElementById('cal-month-label').textContent =
    calMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  const firstDay = new Date(y, m, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = toKey(new Date());

  const container = document.getElementById('cal-days');
  container.innerHTML = '';

  // blank cells before first day
  for (let i = 0; i < firstDay; i++) {
    const blank = document.createElement('div');
    blank.className = 'cal-day empty';
    container.appendChild(blank);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const data = SCHEDULE[dateStr];
    const cell = document.createElement('div');
    cell.className = 'cal-day' + (dateStr === today ? ' today-cell' : '');

    const dayNum = document.createElement('div');
    dayNum.className = 'cal-day-num';
    if (dateStr === today) {
      const inner = document.createElement('div');
      inner.textContent = d;
      dayNum.appendChild(inner);
    } else {
      dayNum.textContent = d;
    }
    cell.appendChild(dayNum);

    if (data) {
      const badge = document.createElement('div');
      const typeClass = data.type.toLowerCase().replace('_', '-');
      const displayMap = {
        'ODD': 'ODD', 'EVEN': 'EVEN', 'NO_SCHOOL': 'No School',
        'EXAM': 'EXAM', 'CAMP': 'CAMP', 'HALF_DAY': 'Half Day', 'PD_DAY': 'PD Day'
      };
      badge.className = `cal-type ${typeClass}`;
      badge.textContent = displayMap[data.type] || data.type;
      cell.appendChild(badge);

      if (data.note) {
        const note = document.createElement('span');
        note.className = 'cal-note';
        note.textContent = data.note;
        cell.appendChild(note);
      }

      // For exam days, add clickable detail
      if (data.type === 'EXAM') {
        const ev = document.createElement('span');
        ev.className = 'cal-event';
        ev.textContent = 'View details';
        ev.onclick = (e) => { e.stopPropagation(); showPopup(dateStr, data); };
        cell.appendChild(ev);
      }
    }

    container.appendChild(cell);
  }
}

function prevMonth() {
  calMonth.setMonth(calMonth.getMonth() - 1);
  renderCalendar();
}
function nextMonth() {
  calMonth.setMonth(calMonth.getMonth() + 1);
  renderCalendar();
}

// ── POPUP ──────────────────────────────────────────────────────────────────
function showPopup(dateStr, data) {
  document.getElementById('popup-title').textContent = data.note || 'Event Details';
  document.getElementById('popup-date').textContent = formatDate(dateStr);
  const cls = document.getElementById('popup-classes');
  cls.innerHTML = `
    <div class="popup-class">
      <strong>Schedule Note</strong>
      <span>${data.type === 'EXAM' ? 'Finals / Exam schedule in effect. Regular class periods may not meet as scheduled.' : data.note || 'See teacher for details.'}</span>
    </div>
  `;
  document.getElementById('popup-overlay').classList.add('open');
}
function closePopup(e) {
  if (!e || e.target === document.getElementById('popup-overlay')) {
    document.getElementById('popup-overlay').classList.remove('open');
  }
}

// ── VIEW SWITCHING ─────────────────────────────────────────────────────────
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelector(`nav button[onclick="showView('${name}')"]`).classList.add('active');
}
</script>
</body>
